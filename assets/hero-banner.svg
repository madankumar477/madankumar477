<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',monospace">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="bd2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="g2" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .mono {{ font-family: 'JetBrains Mono','Fira Code',monospace; }}
      @keyframes blink {{ 0%,49% {{ opacity: 1; }} 50%,100% {{ opacity: 0; }} }}
      .cur {{ animation: blink 1s step-end infinite; }}
      @keyframes scan {{ 0% {{ transform: translateY(0); }} 100% {{ transform: translateY(220px); }} }}
      .scanline {{ animation: scan 3.4s linear infinite; }}
      @keyframes fadeSeq {{ 0% {{opacity:0;}} 8% {{opacity:1;}} 92% {{opacity:1;}} 100% {{opacity:0;}} }}
    </style>
  </defs>

  <rect x="3" y="3" width="994" height="254" rx="16" fill="url(#bg2)" stroke="url(#bd2)" stroke-width="2" filter="url(#g2)"/>
  <rect x="3" y="3" width="994" height="254" rx="16" fill="none" clip-path="inset(0 round 16px)"/>
  <line x1="20" y1="230" x2="500" y2="230" stroke="#22d3ee" stroke-width="1" opacity="0.5" class="scanline"/>

  <text x="50" y="60" class="mono" fill="#22d3ee" font-size="15" opacity="0.85">$ ./boot_sequence.sh</text>
  <text x="50" y="90" class="mono" fill="#64748b" font-size="14">&gt; INITIALIZING DEVELOPER PROFILE<tspan class="cur" fill="#22d3ee">_</tspan></text>
  <text x="50" y="115" class="mono" fill="#4ade80" font-size="14">&gt; SYSTEM ONLINE ✓  USER: MADAN_KUMAR</text>

  <text x="50" y="165" class="mono" fill="#f1f5f9" font-size="42" font-weight="bold">MADAN KUMAR</text>
  <text x="50" y="198" class="mono" fill="#a78bfa" font-size="20" letter-spacing="1">Software Engineer <tspan fill="#475569">//</tspan> AI <tspan fill="#475569">//</tspan> Robotics</text>

  <text x="50" y="230" class="mono" fill="#e879f9" font-size="15">&gt; role.current<tspan fill="#64748b">: </tspan><tspan fill="#22d3ee">"Building Intelligent Systems"</tspan><tspan class="cur" fill="#e879f9">_</tspan></text>

  <g transform="translate(870,50)" opacity="0.9">
    <circle r="34" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.5"/>
    <circle r="24" fill="none" stroke="#a78bfa" stroke-width="2" opacity="0.7"/>
    <circle r="4" fill="#e879f9"/>
  </g>
</svg>