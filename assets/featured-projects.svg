    <text x="464" y="46" text-anchor="end" class="mono tag" fill="#a78bfa">ROBOTICS</text>
    <text x="22" y="58" class="mono desc">Leader-follower robotic arm mirroring system — real-time</text>
    <text x="22" y="76" class="mono desc">pose sync between two Dobot arms via ROS-style control loop.</text>
    <line x1="22" y1="96" x2="458" y2="96" stroke="#1e293b" stroke-width="1"/>
