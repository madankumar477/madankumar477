<svg viewBox="0 0 1080 698" xmlns="http://www.w3.org/2000/svg" font-family="'JetBrains Mono','Fira Code',monospace">
  <defs>
    <style>
      .mono { font-family: 'JetBrains Mono','Fira Code',monospace; }
      .name { fill: #f1f5f9; font-weight: bold; }
      .tag { font-size: 11px; letter-spacing: 1px; }
      .desc { fill: #94a3b8; font-size: 12.5px; }
      .stack_lbl { fill: #64748b; font-size: 10px; letter-spacing: 2px; }
      .stack { fill: #22d3ee; font-size: 12.5px; }
      .link { fill: #a78bfa; font-size: 12px; }
    </style>
  </defs>
  <rect width="1080" height="698" fill="none"/>
  <text x="40" y="35" class="mono" fill="#a78bfa" font-size="18" font-weight="bold" letter-spacing="2">FEATURED.SYSTEMS</text>
  
  <g transform="translate(40,60)">
    <rect width="480" height="178" rx="10" fill="#020617" stroke="#1e293b" stroke-width="1.5"/>
