name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: madankumar477
          outputs: |
            dist/github-snake-dark.svg?color_snake=%2322D3EE&color_dots=%23161B22,%230E7490,%2322D3EE,%23A78BFA,%2310B981
            dist/github-snake-light.svg?color_snake=%237C3AED&color_dots=%23E5E7EB,%23A5F3FC,%2322D3EE,%237C3AED,%2310B981

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
