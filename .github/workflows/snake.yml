name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: madankumar477
          outputs: |
            dist/github-snake-dark.svg?palette=github-dark&color_snake=22D3EE,A78BFA,10B981&color_dots=2d3343,0891B2,22D3EE,A78BFA,10B981
            dist/github-snake-light.svg?color_snake=7C3AED,0891B2,10B981&color_dots=E5E7EB,A5F3FC,22D3EE,7C3AED,10B981

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
